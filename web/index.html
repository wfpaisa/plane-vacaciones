<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vacaciones en familia</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="font" type="font/woff2" href="/iconos/iconos.woff2" crossorigin />
    <link rel="stylesheet" href="/iconos/iconos.css" />
    <link rel="preload" href="/fuentes/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fuentes/fuentes.css" />
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("vacaciones-tema");
        } catch {}
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
